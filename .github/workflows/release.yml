name: Build Clean Script Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  # 面板签名与节点默认备注前缀（替换 "by 233boy" 及节点名称前缀）= GitHub 用户名
  CUSTOM_TAG: "laolitongxue"
  # 文档链接保留 233boy.com（真实文档在那里，替换成仓库地址是死链），仅去签名

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Customize author, remove ads, and clean signatures
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "Using repository owner: ${OWNER}"

          # 1. 下载源 author=233boy -> 你的 GitHub 用户名（install.sh 与 update sh 指向你的仓库）
          sed -i "s/author=233boy/author=${OWNER}/g" install.sh *.sh src/*.sh README.md 2>/dev/null || true
          sed -i "s|233boy/sing-box|${OWNER}/sing-box|g" install.sh *.sh src/*.sh README.md 2>/dev/null || true
          sed -i "s|233boy/Xray|${OWNER}/Xray|gi" install.sh *.sh src/*.sh README.md 2>/dev/null || true
          sed -i "s|233boy/v2ray|${OWNER}/v2ray|gi" install.sh *.sh src/*.sh README.md 2>/dev/null || true

          # 2. 移除内置推广文案、TG 群组（文档链接保留 233boy.com，仅去签名）
          sed -i '/t\.me\/tg233/d' src/*.sh *.sh 2>/dev/null || true
          sed -i '/Just My Socks/Id' src/*.sh *.sh 2>/dev/null || true
          # 2b. 上游把机场广告 URL 混淆为单字符变量拼接（https://g${c}e${n}t${m}j${s}m${b}s.com/），
          #     字面匹配不到，须按行删除（VPS 实测 2026-10-18：仅删 Just My Socks 漏掉此行）
          sed -i '/推广(ads)/d; /机场推荐/d' src/*.sh *.sh 2>/dev/null || true
          # 2c. 删除面板 Twitter 行（2026-10-18 老板要求：不怎么用 Twitter，help.sh 仅此一处）
          sed -i '/Twitter/d' src/*.sh *.sh 2>/dev/null || true

          # 3. 剩余 233boy 签名与节点名称前缀 -> CUSTOM_TAG（先保护 233boy.com 文档链接不被误伤）
          sed -i "s/233boy\.com/__DOCS_LINK__/g" install.sh *.sh src/*.sh README.md 2>/dev/null || true
          sed -i "s/233boy/${CUSTOM_TAG}/gi" install.sh *.sh src/*.sh README.md 2>/dev/null || true
          sed -i "s/__DOCS_LINK__/233boy.com/g" install.sh *.sh src/*.sh README.md 2>/dev/null || true

          # 4. 文档链接改指自托管文档（2026-10-18 拍板：个人文档已落地 fork docs/，不再保留 233boy.com 链接）
          #    核心脚本内的 ^233boy.com$ 域名检查为 no-auto-tls 功能逻辑（非链接），不在此列，保持原样
          sed -i "s|https://233boy.com/\$is_core/\$is_core-script/|https://github.com/\$is_sh_repo/blob/main/docs/usage.md|g" install.sh *.sh src/*.sh README.md 2>/dev/null || true
          sed -i "s|https://233boy.com/\$is_core/no-auto-tls/|https://github.com/\$is_sh_repo/blob/main/docs/no-auto-tls.md|g" install.sh *.sh src/*.sh README.md 2>/dev/null || true
          sed -i "s|https://233boy.com/\$is_core/caddy-auto-tls/|https://github.com/\$is_sh_repo/blob/main/docs/auto-tls.md|g" install.sh *.sh src/*.sh README.md 2>/dev/null || true
          sed -i "s|https://233boy.com|https://github.com/\$is_sh_repo/tree/main/docs|g" install.sh *.sh src/*.sh README.md 2>/dev/null || true

      - name: Package script archives
        run: |
          mkdir -p build_out
          tar -zcf build_out/code.tar.gz --exclude='./.git*' --exclude='./build_out' .
          zip -qr build_out/code.zip . -x ".git*" "build_out/*"
          cp -f install.sh build_out/install.sh

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Clean Release v1.0.${{ github.run_number }}"
          make_latest: true
          files: |
            build_out/code.tar.gz
            build_out/code.zip
            build_out/install.sh
